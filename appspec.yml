version: 0.0
os: linux

files:
  - source: app/                 # relative path inside the bundle (no leading slash)
    destination: /var/www/my-app
    overwrite: true

permissions:
  - object: /var/www/my-app
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  AfterInstall:
    - location: scripts/post_install.sh   # optional: db migrate, env templating, etc.
      timeout: 120
      runas: ubuntu

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 60
      runas: ubuntu

  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: ubuntu
