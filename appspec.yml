version: 0.0
os: linux
files:
  - source: /app
    destination: /var/www/my-app
permissions:
  - object: /var/www/my-app
    pattern: "**"
    owner: ubuntu
    group: ubuntu
hooks:
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/start_application.sh
      timeout: 60
      runas: ubuntu
