name: CI/CD Pipeline for FastAPI App

on:
  push:
    branches:
      - dev # Trigger on pushes to the 'dev' branch
  pull_request:
    branches:
      - dev # Trigger on pull requests targeting the 'dev' branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      id: docker_build # Give this step an ID to reference its outputs
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/your-fastapi-app:${{ github.sha }} # Use SHA for unique tag
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Print pushed image tag
      run: echo "Image pushed: ${{ secrets.DOCKER_USERNAME }}/your-fastapi-app:${{ github.sha }}"

    # --- Kustomize Integration for Deployment (Simulated for Minikube) ---
    - name: Prepare Kustomize overlay for dev deployment
      id: kustomize_prep
      run: |
        # Create a temporary Kustomization file that overrides the image tag
        # This dynamically sets the image tag in the dev overlay
        cp kustomize/overlays/dev/kustomization.yaml kustomize/overlays/dev/kustomization.yaml.bak
        sed -i "s|newTag: dev|newTag: ${{ github.sha }}|" kustomize/overlays/dev/kustomization.yaml
        echo "Kustomization file updated with image tag ${{ github.sha }}"

    - name: Build Kustomize manifests (dry-run for validation)
      run: |
        kubectl kustomize kustomize/overlays/dev/ > manifests_dev.yaml
        echo "Generated manifests:"
        cat manifests_dev.yaml

    # This step is still a simulation for Minikube as direct deployment
    # from GitHub Actions to a local Minikube is not standard practice.
    # For a real cluster, you would configure kubectl with cluster credentials here.
    - name: Simulate Kubernetes Deployment with Kustomize
      run: |
        echo "Simulating Kustomize deployment to Kubernetes for 'dev' environment..."
        echo "In a real CI/CD for a remote cluster (GKE, EKS, etc.):"
        echo "- You would configure kubectl to connect to your cluster."
        echo "- Then, you would run 'kubectl apply -k kustomize/overlays/dev/' using the dynamic image tag."
        echo "For Minikube, you would typically run 'kubectl apply -k kustomize/overlays/dev/' locally after the image is pushed."
        # Example of what you *would* do for a real deployment if you had kubectl configured for a target cluster:
        # - name: Deploy to Kubernetes Dev Cluster
        #   env:
        #     KUBECONFIG_BASE64: ${{ secrets.DEV_KUBECONFIG_BASE64 }} # Store base64 encoded kubeconfig as a secret
        #   run: |
        #     echo $KUBECONFIG_BASE64 | base64 -d > kubeconfig.yaml
        #     chmod 600 kubeconfig.yaml
        #     export KUBECONFIG=./kubeconfig.yaml
        #     kubectl apply -k kustomize/overlays/dev/
        #     kubectl rollout status deployment/my-fastapi-app-dev # Wait for deployment to be ready

    - name: Restore Kustomization file (clean up)
      if: always() # Run this even if previous steps fail
      run: mv kustomize/overlays/dev/kustomization.yaml.bak kustomize/overlays/dev/kustomization.yaml