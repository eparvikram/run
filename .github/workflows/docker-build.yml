# run/.github/workflows/build-image.yml

name: Build & Push SDLC Middleware App Image

on:
  push:
    branches:
      - uplift

  release: # <--- ADD THIS EVENT
    types: [published, created] # Triggers when a release is published or created
    # Other types include: edited, deleted, prereleased, released, unpublished

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    # ... (your existing steps for checkout, Docker login, build/push) ...

    - name: Use Release Tag as Docker Image Tag (Conditional)
      if: github.event_name == 'release'
      run: |
        # For a release, the tag is readily available
        echo "DOCKER_IMAGE_TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
        echo "Using release tag: ${{ github.event.release.tag_name }}"
      # If not a release event, use SHA as fallback for push/PR
      # This makes the build step more generic
      if: github.event_name != 'release'
      run: |
        echo "DOCKER_IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
        echo "Using commit SHA: ${{ github.sha }}"


    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Now use the DOCKER_IMAGE_TAG environment variable set above
        tags: paritoshvikram/sdlc-middleware:${{ env.DOCKER_IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # ... (rest of your steps, like repository_dispatch) ...
    # When using repository_dispatch, pass the correct tag:
    # client-payload: '{"image_tag": "${{ env.DOCKER_IMAGE_TAG }}"}'
