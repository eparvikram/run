# run/.github/workflows/build-image.yml

name: Build & Push SDLC Middleware App Image

on:
  push:
    branches:
      - uplift  # Triggers on push to the 'uplift' branch
      # - main   # Uncomment if needed
  pull_request:        # Builds for PRs to 'uplift' (optional, but useful)
    branches:
      - uplift
  release:             # Triggers when a GitHub Release is created or published
    types: [published, created]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker Image Tag
        id: set_image_tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            IMAGE_TAG="${{ github.event.release.tag_name }}"
            echo "Using release tag: $IMAGE_TAG"
          else
            IMAGE_TAG="${{ github.sha }}"
            echo "Using commit SHA: $IMAGE_TAG"
          fi
          echo "DOCKER_IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: paritoshvikram/sdlc-middleware:${{ env.DOCKER_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed image tag
        run: echo "Docker image built and pushed: paritoshvikram/sdlc-middleware:${{ env.DOCKER_IMAGE_TAG }}"

      # --- Optional: Trigger downstream deployment repository ---
      - name: Trigger Deployment Workflow in sdlc-deploy repo
        if: github.event_name == 'release'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_FOR_SDLC_DEPLOY_REPO }}
          repository: paritoshvikram/sdlc-deploy
          event-type: deploy-sdlc-middleware-dev
          client-payload: |
            {
              "service_folder": "sdlc-middleware",
              "image_tag": "${{ env.DOCKER_IMAGE_TAG }}"
            }
